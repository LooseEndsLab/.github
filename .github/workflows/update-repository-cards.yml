name: Update repository cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-repository-cards.yml"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Render repository cards
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = "profile/README.md";
            const cardsDirectory = "profile/assets/repository-cards";
            const cardVersion = "4";
            const start = "<!-- repository-cards:start -->";
            const end = "<!-- repository-cards:end -->";

            const escapeXml = (value) => String(value)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&apos;");

            const wrapText = (value, maxLength, maxLines) => {
              const words = value.trim().split(/\s+/);
              const lines = [];
              let line = "";

              for (const word of words) {
                const candidate = line ? `${line} ${word}` : word;
                if (candidate.length <= maxLength || !line) {
                  line = candidate;
                  continue;
                }

                lines.push(line);
                line = word;
                if (lines.length === maxLines) break;
              }

              if (lines.length < maxLines && line) lines.push(line);
              const truncated = words.join(" ").length > lines.join(" ").length;
              if (truncated) lines[lines.length - 1] = `${lines.at(-1).replace(/[.,;:!?]?$/, "")}…`;
              return lines;
            };

            const cardFilename = (name) => `${name.replace(/[^a-zA-Z0-9._-]/g, "-")}.svg`;
            const languageColors = {
              CSS: "#663399",
              HTML: "#e34c26",
              JavaScript: "#f1e05a",
              Python: "#3572A5",
              Ruby: "#701516",
              Rust: "#dea584",
              Shell: "#89e051",
              Swift: "#f05138",
              TypeScript: "#3178c6",
            };
            const languageColor = (language) => languageColors[language] || "#8c959f";
            const updatedDate = (date) => new Intl.DateTimeFormat("en-US", {
              month: "short",
              day: "numeric",
              timeZone: "UTC",
            }).format(new Date(date));
            const createdYear = (date) => new Date(date).getUTCFullYear();

            const renderCard = (repository) => {
              const languages = Object.entries(repository.languages || {})
                .sort(([, first], [, second]) => second - first);
              const primaryLanguage = languages[0]?.[0] || repository.language || "Code";
              const accent = languageColor(primaryLanguage);
              const totalBytes = languages.reduce((total, [, bytes]) => total + bytes, 0) || 1;
              let offset = 1;
              const languageBar = languages.length
                ? languages.map(([language, bytes], index) => {
                  const width = index === languages.length - 1
                    ? 719 - offset
                    : Math.round((bytes / totalBytes) * 718);
                  const segment = `<rect x="${offset}" y="300" width="${width}" height="9" fill="${languageColor(language)}"/>`;
                  offset += width;
                  return segment;
                }).join("")
                : `<rect x="1" y="300" width="718" height="9" fill="${accent}"/>`;
              const title = wrapText(repository.name, 32, 2);
              const description = wrapText(
                repository.description || "A lightweight productivity tool from Loose Ends.",
                56,
                2,
              );
              const descriptionY = title.length === 2 ? 170 : 132;
              const descriptionLines = description.map(
                (line, index) => `<text x="36" y="${descriptionY + index * 27}" class="description">${escapeXml(line)}</text>`,
              ).join("");
              const titleLines = title.map(
                (line, index) => `<text x="36" y="${92 + index * 36}" class="title">${escapeXml(line)}</text>`,
              ).join("");
              const homepage = repository.homepage
                ? `<text x="684" y="${descriptionY + 27}" text-anchor="end" class="homepage">Live app ↗</text>`
                : "";

              return [
                `<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-labelledby="title description">`,
                `  <title id="title">${escapeXml(repository.name)}</title>`,
                `  <desc id="description">${escapeXml(repository.description || "A lightweight productivity tool from Loose Ends.")}</desc>`,
                "  <style>.eyebrow { fill: #ffffff; font: 700 12px -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif; letter-spacing: 1.1px; } .title { fill: #1f2328; font: 700 29px -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif; } .description { fill: #3d444d; font: 18px -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif; } .meta-label { fill: #6e7781; font: 700 11px -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif; letter-spacing: .7px; } .meta-value { fill: #24292f; font: 700 16px -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif; } .homepage { fill: #0969da; font: 700 15px -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif; }</style>",
                "  <rect x=\"1\" y=\"1\" width=\"718\" height=\"308\" rx=\"18\" fill=\"#ffffff\" stroke=\"#d0d7de\"/>",
                `  <rect x="1" y="1" width="718" height="10" rx="4" fill="${accent}"/>`,
                `  <rect x="1" y="10" width="9" height="290" fill="${accent}"/>`,
                `  <rect x="36" y="28" width="170" height="28" rx="14" fill="${accent}"/>`,
                "  <text x=\"51\" y=\"47\" class=\"eyebrow\">OPEN-SOURCE TOOL</text>",
                `  ${titleLines}`,
                `  ${descriptionLines}`,
                `  ${homepage}`,
                "  <line x1=\"36\" y1=\"205\" x2=\"684\" y2=\"205\" stroke=\"#d8dee4\"/>",
                `  <circle cx="43" cy="237" r="7" fill="${accent}"/>`,
                `  <text x="58" y="233" class="meta-label">PRIMARY LANGUAGE</text>`,
                `  <text x="58" y="254" class="meta-value">${escapeXml(primaryLanguage)}</text>`,
                `  <text x="264" y="233" class="meta-label">COMMUNITY</text>`,
                `  <text x="264" y="254" class="meta-value">★ ${repository.stargazers_count}   Forks ${repository.forks_count}</text>`,
                `  <text x="477" y="233" class="meta-label">PROJECT PULSE</text>`,
                `  <text x="477" y="254" class="meta-value">${repository.open_issues_count} issues · ${languages.length} languages</text>`,
                `  <text x="684" y="281" text-anchor="end" class="meta-label">UPDATED ${updatedDate(repository.updated_at).toUpperCase()} · SINCE ${createdYear(repository.created_at)}</text>`,
                "  <clipPath id=\"language-bar\"><rect x=\"1\" y=\"300\" width=\"718\" height=\"9\" rx=\"4\"/></clipPath>",
                `  <g clip-path="url(#language-bar)">${languageBar}</g>`,
                "</svg>",
              ].join("\n");
            };

            const repositories = await github.paginate(
              github.rest.repos.listForOrg,
              {
                org: owner,
                type: "public",
                sort: "updated",
                direction: "desc",
                per_page: 100,
              },
            );

            const projectRepositories = await Promise.all(
              repositories
                .filter((repository) => repository.name !== ".github")
                .map(async (repository) => {
                  const languages = await github.rest.repos.listLanguages({
                    owner,
                    repo: repository.name,
                  });
                  return { ...repository, languages: languages.data };
                }),
            );
            const cards = projectRepositories
              .map((repository, index) => {
                const card = [
                  `<a href="${repository.html_url}">`,
                  `  <img width="48%" src="./assets/repository-cards/${cardFilename(repository.name)}?v=${cardVersion}" alt="${repository.name} repository card" />`,
                  "</a>",
                ].join("\n");

                return index % 2 === 0
                  ? `${card}${index === projectRepositories.length - 1 ? "" : "\n&nbsp;"}`
                  : `${card}\n<br />`;
              })
              .join("\n");

            const replacement = `${start}\n<br />\n${cards || "No public repositories yet."}\n<br />\n<br />\n${end}`;
            const current = await github.rest.repos.getContent({ owner, repo, path });

            if (Array.isArray(current.data) || current.data.type !== "file") {
              core.setFailed(`${path} is not a file.`);
              return;
            }

            const readme = Buffer.from(current.data.content, "base64").toString("utf8");
            const expression = new RegExp(`${start}[\\s\\S]*?${end}`);

            if (!expression.test(readme)) {
              core.setFailed("Repository-card markers are missing from the profile README.");
              return;
            }

            const updated = readme.replace(expression, replacement);

            const cardContents = new Map(
              projectRepositories.map((repository) => [
                `${cardsDirectory}/${cardFilename(repository.name)}`,
                renderCard(repository),
              ]),
            );
            let existingCards = [];

            try {
              const directory = await github.rest.repos.getContent({
                owner,
                repo,
                path: cardsDirectory,
              });
              existingCards = Array.isArray(directory.data) ? directory.data : [];
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const updates = [];
            for (const [cardPath, content] of cardContents) {
              const existing = existingCards.find((file) => file.path === cardPath);
              if (!existing) {
                updates.push({ path: cardPath, mode: "100644", type: "blob", content });
                continue;
              }

              const file = await github.rest.repos.getContent({ owner, repo, path: cardPath });
              const existingContent = Buffer.from(file.data.content, "base64").toString("utf8");
              if (existingContent !== content) {
                updates.push({ path: cardPath, mode: "100644", type: "blob", content });
              }
            }

            for (const existing of existingCards) {
              if (!cardContents.has(existing.path)) {
                updates.push({ path: existing.path, mode: "100644", type: "blob", sha: null });
              }
            }

            if (updated !== readme) {
              updates.push({ path, mode: "100644", type: "blob", content: updated });
            }

            if (updates.length === 0) {
              core.info("Repository cards are already up to date.");
              return;
            }

            const reference = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${context.ref.replace("refs/heads/", "")}`,
            });
            const baseCommit = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: reference.data.object.sha,
            });
            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: baseCommit.data.tree.sha,
              tree: updates,
            });
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: "chore: update repository cards",
              tree: tree.data.sha,
              parents: [reference.data.object.sha],
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${context.ref.replace("refs/heads/", "")}`,
              sha: commit.data.sha,
            });
